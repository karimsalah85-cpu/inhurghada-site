<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Daily Red Sea">
  <!--
    Simplified square brand mark for favicons / app icons.
    Not the horizontal "dailyredsea.com" wordmark: a lowercase "d" monogram
    (the first, most distinctive glyph of the wordmark) with the brand coral
    accent dot, on the brand navy. Palette matches the wordmark exactly:
    navy #0A2D57, coral #FF5A3C, white.
  -->
  <rect width="512" height="512" rx="104" fill="#0A2D57"/>
  <g>
    <!-- ascender / stem -->
    <rect x="300" y="92" width="58" height="330" rx="18" fill="#ffffff"/>
    <!-- bowl -->
    <circle cx="232" cy="330" r="122" fill="#ffffff"/>
    <!-- counter (navy shows through) -->
    <circle cx="222" cy="330" r="60" fill="#0A2D57"/>
    <!-- brand accent dot -->
    <circle cx="380" cy="392" r="27" fill="#FF5A3C"/>
  </g>
</svg>
