name: Preview smoke test

on:
  deployment_status:

concurrency:
  group: smoke-${{ github.event.deployment.id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify preview deployment
        run: npm run test:smoke -- "${{ github.event.deployment_status.target_url }}"
